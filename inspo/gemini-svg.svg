<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- GLOBAL COLOR PALETTE STYLES -->
    <style>
      .bg-navy { fill: #1A2536; }
      .c-navy { fill: #1A2536; }
      .c-gold { fill: #E5A93C; }
      .c-coral { fill: #E76F51; }
      .c-teal { fill: #52A098; }
      .c-pink { fill: #F4A261; }
      .c-soft-pink { fill: #E8A5A5; }
      .c-cream { fill: #FFF9EF; }
      
      .stroke-gold { stroke: #E5A93C; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stroke-navy { stroke: #1A2536; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stroke-cream { stroke: #FFF9EF; stroke-width: 6; stroke-dasharray: 12 12; fill: none; }
    </style>

    <!-- 1. RETRO SUNBURST MEDALLION -->
    <g id="motif-sunburst">
      <circle cx="0" cy="0" r="32" class="c-gold" />
      <!-- Sun Rays -->
      <path d="M0 -45 L6 -34 L-6 -34 Z M0 45 L6 34 L-6 34 Z M-45 0 L-34 6 L-34 -6 Z M45 0 L34 6 L34 -6 Z" class="c-gold" />
      <path d="M-30 -30 L-20 -26 L-26 -20 Z M30 -30 L26 -20 L20 -26 Z M-30 30 L-26 20 L-20 26 Z M30 30 L20 26 L26 20 Z" class="c-gold" />
      <!-- Friendly Face -->
      <circle cx="-10" cy="-6" r="3" class="c-navy" />
      <circle cx="10" cy="-6" r="3" class="c-navy" />
      <path d="M -12 8 Q 0 20 12 8" stroke="#1A2536" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="-15" cy="4" r="4" class="c-soft-pink" opacity="0.6" />
      <circle cx="15" cy="4" r="4" class="c-soft-pink" opacity="0.6" />
    </g>

    <!-- 2. MID-CENTURY STARBURST (SPARKLE) -->
    <g id="motif-starburst">
      <path d="M 0 -25 Q 0 0 25 0 Q 0 0 0 25 Q 0 0 -25 0 Q 0 0 0 -25 Z" class="c-gold" />
    </g>

    <!-- 3. PAPER-CUT PALM TREE -->
    <g id="motif-palm-tree">
      <!-- Trunk -->
      <path d="M -5 50 Q 5 20 -3 -20 L 5 -20 Q 15 20 5 50 Z" class="c-coral" />
      <!-- Fronds -->
      <path d="M 0 -20 Q -25 -40 -45 -20 Q -20 -15 0 -20 Z" class="c-teal" />
      <path d="M 0 -20 Q 25 -40 45 -20 Q 20 -15 0 -20 Z" class="c-teal" />
      <path d="M 0 -20 Q -35 0 -50 25 Q -20 10 0 -20 Z" class="c-teal" />
      <path d="M 0 -20 Q 35 0 50 25 Q 20 10 0 -20 Z" class="c-teal" />
    </g>

    <!-- 4. STYLIZED CASTLE SPIRE -->
    <g id="motif-castle-spire">
      <!-- Base Tower -->
      <rect x="-20" y="-10" width="40" height="60" class="c-pink" rx="2" />
      <!-- Arch Door -->
      <path d="M -10 50 L -10 25 A 10 10 0 0 1 10 25 L 10 50 Z" class="c-navy" />
      <!-- Turret Roof -->
      <path d="M -25 -10 L 0 -60 L 25 -10 Z" class="c-teal" />
      <!-- Flag -->
      <path d="M 0 -60 L 0 -75 L 15 -67.5 Z" class="c-gold" />
    </g>

    <!-- 5. ROLLER COASTER LOOP & CART -->
    <g id="motif-coaster-loop">
      <!-- Track Loop -->
      <path d="M -60 60 C -60 -20 -20 -60 0 -60 C 30 -60 50 -10 20 30 C -10 60 40 60 60 60" class="stroke-gold" />
      <!-- Coaster Cart -->
      <g transform="translate(-28, -25) rotate(-30)">
        <rect x="-15" y="-10" width="30" height="18" rx="4" class="c-coral" />
        <circle cx="-8" cy="10" r="4" class="c-navy" />
        <circle cx="8" cy="10" r="4" class="c-navy" />
      </g>
    </g>

    <!-- 6. TICKET STUB / SCALLOPED BORDER FRAME -->
    <g id="motif-ticket-badge">
      <path d="M -80 -50 
               Q -80 -40 -90 -40 
               L -90 40 
               Q -80 40 -80 50 
               L 80 50 
               Q 80 40 90 40 
               L 90 -40 
               Q 80 -40 80 -50 
               Z" class="c-cream" />
      <line x1="-65" y1="-50" x2="-65" y2="50" class="stroke-navy" stroke-dasharray="4 4" />
      <text x="0" y="8" font-family="monospace" font-weight="bold" font-size="18" fill="#1A2536" text-anchor="middle">ADMIT TWO • 40+45</text>
    </g>

    <!-- 7. VINTAGE AIRPLANE -->
    <g id="motif-airplane">
      <path d="M -40 0 C -20 -12 20 -12 40 0 C 20 8 -20 8 -40 0 Z" class="c-teal" />
      <!-- Wings -->
      <path d="M -5 -5 L 10 -25 L 20 -25 L 5 -5 Z" class="c-gold" />
      <path d="M -5 5 L 10 25 L 20 25 L 5 5 Z" class="c-gold" />
      <!-- Tail -->
      <path d="M -30 0 L -42 -15 L -32 -15 Z" class="c-coral" />
    </g>
  </defs>

  <!-- DISPLAY BOARD / CANVAS BACKGROUND -->
  <rect width="100%" height="100%" class="bg-navy" />

  <!-- SECTION TITLE -->
  <text x="50" y="60" font-family="sans-serif" font-weight="bold" font-size="24" fill="#FFF9EF" letter-spacing="2">PARTIU ORLANDO — BRAND MOTIFS (SVG SPRITE)</text>
  <line x1="50" y1="80" x2="950" y2="80" stroke="#E5A93C" stroke-width="2" />

  <!-- GRID LAYOUT OF MOTIFS -->

  <!-- Row 1: Sunburst, Starbursts, Airplane -->
  <g transform="translate(150, 200)">
    <use href="#motif-sunburst" />
    <text x="0" y="80" font-family="sans-serif" font-size="12" fill="#E5A93C" text-anchor="middle">#motif-sunburst</text>
  </g>

  <g transform="translate(380, 200)">
    <use href="#motif-starburst" transform="scale(1.2)" />
    <use href="#motif-starburst" transform="translate(40, -20) scale(0.6)" />
    <use href="#motif-starburst" transform="translate(-35, 25) scale(0.5)" />
    <text x="0" y="80" font-family="sans-serif" font-size="12" fill="#E5A93C" text-anchor="middle">#motif-starburst</text>
  </g>

  <g transform="translate(650, 200)">
    <use href="#motif-airplane" transform="scale(1.3) rotate(-10)" />
    <text x="0" y="80" font-family="sans-serif" font-size="12" fill="#E5A93C" text-anchor="middle">#motif-airplane</text>
  </g>

  <!-- Row 2: Spire, Palm Tree, Coaster Loop -->
  <g transform="translate(150, 430)">
    <use href="#motif-castle-spire" transform="scale(1.1)" />
    <text x="0" y="90" font-family="sans-serif" font-size="12" fill="#E5A93C" text-anchor="middle">#motif-castle-spire</text>
  </g>

  <g transform="translate(380, 430)">
    <use href="#motif-palm-tree" transform="scale(1.1)" />
    <text x="0" y="90" font-family="sans-serif" font-size="12" fill="#E5A93C" text-anchor="middle">#motif-palm-tree</text>
  </g>

  <g transform="translate(650, 430)">
    <use href="#motif-coaster-loop" transform="scale(1.1)" />
    <text x="0" y="90" font-family="sans-serif" font-size="12" fill="#E5A93C" text-anchor="middle">#motif-coaster-loop</text>
  </g>

  <!-- Row 3: Ticket Badge Header / Divider -->
  <g transform="translate(500, 650)">
    <use href="#motif-ticket-badge" transform="scale(1.8)" />
    <text x="0" y="80" font-family="sans-serif" font-size="12" fill="#E5A93C" text-anchor="middle">#motif-ticket-badge</text>
  </g>

</svg>
